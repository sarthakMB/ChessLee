# Chess App Nginx Configuration
#
# Installation on VPS:
#   sudo cp deploy/nginx-chess-app.conf /etc/nginx/sites-available/chess-app
#   sudo ln -s /etc/nginx/sites-available/chess-app /etc/nginx/sites-enabled/
#   sudo rm /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then run certbot for SSL:
#   sudo certbot --nginx -d yourdomain.com

server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com;  # Both @ and www

    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Forward client info
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket timeout (24 hours for long-lived connections)
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }
}
