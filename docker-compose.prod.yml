# Production overrides
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Requires .env file on server with:
#   SESSION_SECRET=<random-64-char-string>

services:
  app:
    # In Phase 2+, replace 'build' with 'image' from registry:
    # image: ghcr.io/YOUR_USERNAME/chess-app:latest
    tty: true
    environment:
      NODE_ENV: production
      SESSION_SECRET: ${SESSION_SECRET}
      PINO: compact
    volumes: []  # No source mounts in production
    restart: unless-stopped

  postgres:
    ports: []  # Don't expose postgres to host in production
    restart: unless-stopped

  redis:
    ports: []  # Don't expose redis to host in production
    restart: unless-stopped
